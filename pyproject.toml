[project]
name = "f1-race-intelligence"
version = "0.1.0"
description = "An end-to-end Formula 1 race prediction and strategy platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastf1",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "sqlalchemy>=2.0,<3.0",
    "alembic",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "jupyter",
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1ri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
